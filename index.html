<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Al-Hakem - Real Linux in your Browser</title>
<meta http-equiv="refresh" content="0; url=./src/app.html">
<style>
  html,body{margin:0;height:100%;background:#0a0e0b;color:#33ff77;
    font-family:monospace;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:16px}
  a{color:#33ff77;text-decoration:none;border:1px solid #33ff77;
    padding:10px 20px;border-radius:6px;font-weight:bold}
  a:hover{background:#33ff77;color:#04140a}
  .spin{width:36px;height:36px;border:3px solid #1c2a20;
    border-top-color:#33ff77;border-radius:50%;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sub{color:#5c7a63;font-size:12px}
</style>
</head>
<body>
  <div class="spin"></div>
  <div style="font-weight:900;letter-spacing:2px">TERMINAL AL-HAKEM</div>
  <div class="sub">redirecting to the terminal...</div>
  <a href="./src/app.html">Open Terminal Al-Hakem →</a>
  <script>
    setTimeout(()=>{ window.location.href='./src/app.html'; }, 500);
  </script>
</body>
</html>
